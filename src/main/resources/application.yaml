# ===================================================================
# AgentScope Java 2.0 GA 企业级多智能体应用 —— 本地引导配置
# ===================================================================
# 配置策略：
# 1. 本文件仅保留 Nacos 连接信息和应用名，作为引导配置
# 2. 所有业务配置（数据源、Redis、AgentScope 特性、限流熔断等）全部推送到 Nacos
# 3. Nacos 命名空间：agent-scope-framework-dev
# 4. Nacos 配置文件：application-config.yml，分组：SCOPE_GROUP
# 5. Nacos 不可达时降级读取本地 nacos-application-config.yml
# ===================================================================
spring:
  application:
    name: agent-scope-framework

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      # 服务发现配置（仅连接信息）
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:30104}
        namespace: ${NACOS_NAMESPACE:agent-scope-framework-dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:SCOPE_GROUP}
        register-enabled: ${NACOS_REGISTER_ENABLED:false}
      # 配置中心连接（仅连接信息）
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:30104}
        namespace: ${NACOS_NAMESPACE:agent-scope-framework-dev}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_GROUP:SCOPE_GROUP}
        refresh-enabled: true
        file-extension: yml

  # 通过 spring.config.import 加载配置：
  # 1. 优先从 Nacos 配置中心加载 application-config.yml
  # 2. Nacos 不可达时降级从 classpath 加载 nacos-application-config.yml（打包在 JAR 内）
  config:
    import:
      - "optional:nacos:application-config.yml?group=SCOPE_GROUP"
      - "optional:classpath:nacos-application-config.yml"
